# Isolated App Server CODEX_HOME. No inherited host plugins or config.
approval_policy = "never"
default_permissions = "factory-canary"
web_search = "disabled"
[features]
apps = false
# Managed network namespace permits local IPC; an empty allowlist denies egress.
[features.network_proxy]
enabled = true
[shell_environment_policy]
inherit = "none"
include_only = []
# Keep system Bubblewrap discoverable after the command environment is cleared.
[shell_environment_policy.set]
PATH = "/usr/bin:/bin"
[permissions.factory-canary]
extends = ":workspace"
[permissions.factory-canary.filesystem]
":root" = "deny"
":minimal" = "read"
":slash_tmp" = "deny"
":tmpdir" = "deny"
# Exact installed executable only: required for the sandbox seccomp re-entry.
"@CODEX_EXECUTABLE@" = "read"
"/home/toluadmin/.cache/ms-playwright" = "read"
[permissions.factory-canary.filesystem.":workspace_roots"]
"." = "write"
# Task clones have private Git metadata; local commits need this explicit grant.
".git" = "write"
"**/*.env" = "deny"
"**/*.pem" = "deny"
[permissions.factory-canary.network]
enabled = true
[permissions.factory-canary.network.domains]
# No external destinations authorized.
